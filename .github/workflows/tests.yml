name: Pruebas de FumetaOS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Comprobar sintaxis
        run: |
          for script in bin/fumetaos bin/fumetaos-doctor bin/fumetaos-help modules/monitor/backups.sh; do
            bash -n "$script" || exit
          done
      - name: Pruebas de Bash
        run: |
          bash tests/test-nightly.sh
          bash tests/test-smart-short.sh
      - name: Pruebas de Python
        run: python3 -B -m unittest discover -s tests
